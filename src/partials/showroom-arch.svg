<?xml version="1.0" encoding="UTF-8"?>
<!-- Архитектура сцены каталога-шоурума (js/showroom.js, css/showroom.css). Редактируется в любом векторном редакторе (Inkscape, Figma, Illustrator): сборка (node tools/build.js) встраивает этот файл в страницу каталога.
     Холст 1000×680: стена до y=500, пол ниже; подиумы и товары рисует сайт поверх. Не переименовывайте id градиентов (shw…) без замены ссылок. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMax slice">
<defs>
<linearGradient id="shwWall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2d2ba"/><stop offset=".32" stop-color="#eee3d0"/><stop offset=".62" stop-color="#f3eadb"/><stop offset="1" stop-color="#e6d6bf"/></linearGradient>
<linearGradient id="shwWallV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#7a5a30" stop-opacity=".12"/></linearGradient>
<linearGradient id="shwEdge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9c8ac"/><stop offset=".45" stop-color="#f7f0e3"/><stop offset="1" stop-color="#dbcab0"/></linearGradient>
<linearGradient id="shwInner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf5ea"/><stop offset="1" stop-color="#ecdfc9"/></linearGradient>
<linearGradient id="shwInnerShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a5a30" stop-opacity=".22"/><stop offset=".22" stop-color="#7a5a30" stop-opacity="0"/><stop offset=".86" stop-color="#7a5a30" stop-opacity="0"/><stop offset="1" stop-color="#7a5a30" stop-opacity=".12"/></linearGradient>
<linearGradient id="shwBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0" stop-opacity=".62"/><stop offset=".7" stop-color="#fffaf0" stop-opacity=".16"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/></linearGradient>
<linearGradient id="shwFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dccdb4"/><stop offset=".4" stop-color="#e9ddc8"/><stop offset="1" stop-color="#f3eadb"/></linearGradient>
<linearGradient id="shwShelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ec"/><stop offset="1" stop-color="#e3d4bb"/></linearGradient>
<linearGradient id="shwVase" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8c8ad"/><stop offset=".4" stop-color="#faf5ea"/><stop offset="1" stop-color="#cdbb9e"/></linearGradient>
<linearGradient id="shwDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b3228"/><stop offset=".4" stop-color="#6b5e50"/><stop offset="1" stop-color="#2d261e"/></linearGradient>
<radialGradient id="shwGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffaf0" stop-opacity=".7"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="500" fill="url(#shwWall)"/>
<rect width="1000" height="500" fill="url(#shwWallV)"/>
<!-- центральная ниша: тонкая арка на глубине -->
<path d="M372 500V258a128 128 0 0 1 256 0V500Z" fill="#f6eee0" opacity=".7"/>
<path d="M372 500V258a128 128 0 0 1 256 0V500" fill="none" stroke="#dcccb2" stroke-width="5" opacity=".9"/>
<path d="M388 500V260a112 112 0 0 1 224 0V500" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/>
<!-- левая арка -->
<path d="M18 500V232a156 156 0 0 1 312 0V500Z" fill="url(#shwEdge)"/>
<path d="M46 500V234a128 128 0 0 1 256 0V500Z" fill="url(#shwInner)"/>
<path d="M46 500V234a128 128 0 0 1 256 0V500Z" fill="url(#shwInnerShade)"/>
<path d="M46 500V234a128 128 0 0 1 256 0V500" fill="none" stroke="#c9b697" stroke-width="2" opacity=".7"/>
<ellipse cx="174" cy="330" rx="86" ry="120" fill="url(#shwGlow)" opacity=".8"/>
<!-- правая арка с полками -->
<path d="M648 500V214a176 176 0 0 1 352 0V500Z" fill="url(#shwEdge)"/>
<path d="M680 500V216a144 144 0 0 1 288 0V500Z" fill="url(#shwInner)"/>
<path d="M680 500V216a144 144 0 0 1 288 0V500Z" fill="url(#shwInnerShade)"/>
<path d="M680 500V216a144 144 0 0 1 288 0V500" fill="none" stroke="#c9b697" stroke-width="2" opacity=".7"/>
<g>
<rect x="698" y="296" width="252" height="9" rx="2" fill="url(#shwShelf)"/><rect x="698" y="305" width="252" height="14" fill="#7a5a30" opacity=".07"/>
<rect x="698" y="372" width="252" height="9" rx="2" fill="url(#shwShelf)"/><rect x="698" y="381" width="252" height="14" fill="#7a5a30" opacity=".07"/>
<rect x="698" y="448" width="252" height="9" rx="2" fill="url(#shwShelf)"/><rect x="698" y="457" width="252" height="14" fill="#7a5a30" opacity=".07"/>
<!-- декор на полках: безымянные сосуды (не товары каталога) -->
<rect x="720" y="262" width="22" height="34" rx="9" fill="url(#shwVase)"/><rect x="727" y="254" width="8" height="10" rx="2" fill="#cdbb9e"/>
