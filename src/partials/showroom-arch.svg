<ellipse cx="868" cy="284" rx="14" ry="12" fill="url(#shwVase)"/><rect x="861" y="262" width="14" height="14" rx="3" fill="#d8c8ad"/>
<rect x="906" y="250" width="16" height="46" rx="7" fill="url(#shwDark)"/><rect x="910" y="243" width="8" height="9" rx="2" fill="#3b3228"/>
<ellipse cx="740" cy="364" rx="19" ry="8" fill="url(#shwVase)"/><rect x="722" y="350" width="36" height="14" rx="5" fill="url(#shwVase)"/>
<rect x="800" y="332" width="18" height="40" rx="8" fill="url(#shwVase)"/>
<rect x="852" y="344" width="34" height="28" rx="7" fill="url(#shwVase)"/>
<rect x="914" y="338" width="20" height="34" rx="8" fill="url(#shwVase)"/>
<rect x="716" y="414" width="24" height="34" rx="9" fill="url(#shwVase)"/>
<rect x="780" y="426" width="40" height="22" rx="6" fill="url(#shwVase)"/>
<rect x="888" y="404" width="18" height="44" rx="8" fill="url(#shwVase)"/>
</g>
