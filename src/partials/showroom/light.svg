<?xml version="1.0" encoding="UTF-8"?>
<!-- Слой «свет»: окно слева сверху бросает на стену косые пятна с тенью переплёта и мягкие лучи. Холст 1536×1024. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="none">
<defs>
  <linearGradient id="lgPatch" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="620">
    <stop offset="0" stop-color="#fffaf0" stop-opacity=".62"/><stop offset=".6" stop-color="#fffaf0" stop-opacity=".26"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lgBeam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="760">
    <stop offset="0" stop-color="#fffaf0" stop-opacity=".5"/><stop offset=".7" stop-color="#fffaf0" stop-opacity=".12"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
  </linearGradient>
  <filter id="lgSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="lgSoft2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.2"/></filter>
  <clipPath id="lgPatchClip"><path d="M-40 0H420L1040 640H460Z"/></clipPath>
</defs>
<!-- большое косое пятно света -->
<g filter="url(#lgSoft)"><path d="M-40 0H420L1040 640H460Z" fill="url(#lgPatch)"/></g>
<!-- тень оконного переплёта: две наклонные и две вертикальные полосы внутри пятна -->
<g clip-path="url(#lgPatchClip)" filter="url(#lgSoft2)" stroke="#8b6a3e" stroke-opacity=".17" stroke-width="16" fill="none">
  <path d="M160 -20L760 640M300 -20L900 640"/>
  <path d="M-20 130H1100M-20 300H1100" transform="rotate(-6 400 200)"/>
</g>
<!-- лучи -->
<g filter="url(#lgSoft)">
  <path d="M520 0H600L1000 760H860Z" fill="url(#lgBeam)" opacity=".55"/>
  <path d="M760 0H900L1280 700H1130Z" fill="url(#lgBeam)" opacity=".34"/>
  <path d="M1080 0H1130L1300 520H1220Z" fill="url(#lgBeam)" opacity=".28"/>
</g>
</svg>
