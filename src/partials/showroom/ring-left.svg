<?xml version="1.0" encoding="UTF-8"?>
<!-- Слой «левая арка»: толстое кольцо из матового камня и сатинового стекла (холст 1536×1024, как вся сцена). Правится в любом векторном редакторе. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="none">
<defs>
  <linearGradient id="rlBand" gradientUnits="userSpaceOnUse" x1="260" y1="60" x2="620" y2="760">
    <stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/>
    <stop offset=".38" stop-color="#f3e8d5" stop-opacity=".78"/>
    <stop offset=".72" stop-color="#e2d0b4" stop-opacity=".86"/>
    <stop offset="1" stop-color="#cdb792" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="rlSheen" gradientUnits="userSpaceOnUse" x1="250" y1="300" x2="700" y2="120">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rlFloorFade" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="700">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="rlMask"><rect width="1536" height="700" fill="url(#rlFloorFade)"/><rect width="1536" height="600" fill="#fff"/></mask>
  <filter id="rlBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="rlBlur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<g mask="url(#rlMask)">
  <!-- падающая тень кольца на заднюю стену (свет слева сверху → тень вправо-вниз) -->
  <path d="M296 760V760A480 760 0 0 1 776 0" transform="translate(34 18)" fill="none" stroke="#7a5a30" stroke-opacity=".34" stroke-width="54" filter="url(#rlBlur)"/>
  <path d="M296 760V760A480 760 0 0 1 776 0" transform="translate(12 6)" fill="none" stroke="#7a5a30" stroke-opacity=".22" stroke-width="46" filter="url(#rlBlur2)"/>
  <!-- внутренний откос (видимая боковая грань кольца со стороны центра) -->
  <path d="M280 760V1024M280 760A480 760 0 0 1 760 0" transform="translate(-22 0)" fill="none" stroke="#bda583" stroke-opacity=".55" stroke-width="16"/>
  <!-- лицевая грань -->
  <path d="M280 1024V760A480 760 0 0 1 760 0" fill="none" stroke="url(#rlBand)" stroke-width="46"/>
  <path d="M280 1024V760A480 760 0 0 1 760 0" fill="none" stroke="url(#rlSheen)" stroke-width="46"/>
  <!-- кромки: яркий блик по внешнему краю и тёмная линия по внутреннему -->
  <path d="M257 1024V760A503 783 0 0 1 760 -23" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.4"/>
  <path d="M303 1024V760A457 737 0 0 1 760 23" fill="none" stroke="#8b6c40" stroke-opacity=".3" stroke-width="3"/>
  <path d="M298 1024V760A462 742 0 0 1 760 18" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>
  <!-- внутренний свет по толщине стекла -->
  <path d="M280 1024V760A480 760 0 0 1 760 0" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10" filter="url(#rlBlur2)" transform="translate(-6 0)"/>
</g>
</svg>
