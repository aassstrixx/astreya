# nginx перед сервером «Астрея» (https). Сертификат — Let's Encrypt (certbot) или любой другой.
# Замените astreya.example.ru и пути к сертификату. В настройках сервера: TRUST_PROXY=1, SECURE_COOKIES=1, PUBLIC_URL=https://astreya.example.ru.
# Важно: адрес клиента передаётся заголовком, который nginx ПЕРЕЗАПИСЫВАЕТ ($remote_addr), а не дополняет — так подменить его нельзя.
limit_req_zone $binary_remote_addr zone=astreya_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=astreya_lead:10m rate=30r/m;

server {
	listen 80;
	server_name astreya.example.ru www.astreya.example.ru;
	return 301 https://astreya.example.ru$request_uri;
}
server {
	listen 443 ssl http2;
	server_name astreya.example.ru;
	ssl_certificate     /etc/letsencrypt/live/astreya.example.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/astreya.example.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	client_max_body_size 12m;
	server_tokens off;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 120s;

	# сжатие: сам сервер «Астрея» уже отдаёт br/gzip (nginx такой ответ повторно не жмёт); эти строки — для ответов, пришедших без сжатия
	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

	location = /api/login      { limit_req zone=astreya_login burst=5 nodelay; proxy_pass http://127.0.0.1:8080; }
	location = /api/login/2fa  { limit_req zone=astreya_login burst=5 nodelay; proxy_pass http://127.0.0.1:8080; }
	location = /api/lead       { limit_req zone=astreya_lead burst=10 nodelay; proxy_pass http://127.0.0.1:8080; }
	location /api/assistant    { gzip off; proxy_buffering off; proxy_pass http://127.0.0.1:8080; }   # ответы потоком
	location /                 { proxy_pass http://127.0.0.1:8080; }
}
